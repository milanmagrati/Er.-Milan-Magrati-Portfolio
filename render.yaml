services:
  - type: web
    name: milan-magrati-portfolio
    runtime: python
    healthCheckPath: /health/
    buildCommand: "./build.sh"
    startCommand: "cd project && gunicorn project.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_EMAIL
        value: "milanmagrati68@gmail.com"
      - key: ADMIN_PASSWORD
        sync: false
