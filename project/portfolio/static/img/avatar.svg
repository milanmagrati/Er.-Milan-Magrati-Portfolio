<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#c68b59"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Circle with glowing subtle rim -->
  <circle cx="200" cy="200" r="192" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="4"/>

  <!-- Code / Tech subtle ambient pattern -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 60 140 L 40 160 L 60 180"/>
    <path d="M 340 140 L 360 160 L 340 180"/>
    <path d="M 70 240 L 50 260 L 70 280"/>
    <path d="M 330 240 L 350 260 L 330 280"/>
    <line x1="80" y1="180" x2="100" y2="130"/>
    <line x1="320" y1="180" x2="300" y2="130"/>
  </g>

  <!-- Body / Shoulders -->
  <g filter="url(#shadowFilter)">
    <!-- Dark Tech Jacket / Hoodie -->
    <path d="M 90 380 C 95 310, 140 270, 200 270 C 260 270, 305 310, 310 380 Z" fill="url(#shirtGrad)" stroke="#334155" stroke-width="2"/>
    <!-- Inner T-shirt with cyan accent collar -->
    <path d="M 160 275 L 200 330 L 240 275 Z" fill="#0f172a"/>
    <path d="M 175 272 Q 200 295 225 272" stroke="url(#accentGrad)" stroke-width="3" fill="none"/>
  </g>

  <!-- Neck -->
  <rect x="180" y="210" width="40" height="70" rx="8" fill="url(#skinGrad)"/>
  <!-- Neck shadow -->
  <path d="M 180 230 Q 200 245 220 230 L 220 240 Q 200 255 180 240 Z" fill="#b07d50" opacity="0.6"/>

  <!-- Head / Face -->
  <g filter="url(#shadowFilter)">
    <ellipse cx="200" cy="175" rx="55" ry="68" fill="url(#skinGrad)"/>

    <!-- Hair (Modern textured crop) -->
    <path d="M 142 165 C 138 120, 160 100, 200 98 C 240 100, 262 120, 258 165 C 255 135, 245 115, 200 115 C 155 115, 145 135, 142 165 Z" fill="#18181b"/>
    <path d="M 148 135 C 160 105, 210 102, 252 128 C 242 110, 220 102, 195 104 C 170 106, 154 118, 148 135 Z" fill="#27272a"/>

    <!-- Eyebrows -->
    <path d="M 162 150 Q 175 145 188 150" stroke="#18181b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 212 150 Q 225 145 238 150" stroke="#18181b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Focused, intelligent) -->
    <circle cx="175" cy="162" r="5" fill="#18181b"/>
    <circle cx="225" cy="162" r="5" fill="#18181b"/>
    <circle cx="173" cy="160" r="1.5" fill="#ffffff"/>
    <circle cx="223" cy="160" r="1.5" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M 200 162 L 197 182 L 204 182" stroke="#b07d50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Professional Smile -->
    <path d="M 185 198 Q 200 208 215 198" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Sleek Minimal Glasses / Tech Aesthetic -->
    <rect x="156" y="152" width="36" height="24" rx="6" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
    <rect x="208" y="152" width="36" height="24" rx="6" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
    <line x1="192" y1="162" x2="208" y2="162" stroke="#38bdf8" stroke-width="2"/>
    <line x1="145" y1="160" x2="156" y2="160" stroke="#38bdf8" stroke-width="2"/>
    <line x1="244" y1="160" x2="255" y2="160" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Developer Initials / Accent Pill at Bottom Center -->
  <g transform="translate(140, 345)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="1.5"/>
    <text x="60" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      &lt;DEV /&gt;
    </text>
  </g>
</svg>
