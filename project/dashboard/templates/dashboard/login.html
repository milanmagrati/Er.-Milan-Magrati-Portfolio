{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Login | Milan Magrati Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 50%, #111827 0%, #090d16 100%);
      padding: 1.5rem;
    }
    .login-card {
      background: var(--dash-card);
      border: 1px solid var(--dash-border);
      border-radius: var(--radius-lg);
      padding: 2.75rem 2.25rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
      text-align: center;
    }
    .login-brand-badge {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-brand">
    <div class="login-brand-badge">MM</div>
    <h2 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em;">Portfolio CMS Login</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Sign in to manage your portfolio content</p>
  </div>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}">
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label" for="id_username">Username</label>
      <input type="text" name="username" id="id_username" class="form-control" placeholder="admin" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="id_password">Password</label>
      <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 0.75rem;">
      <span>Sign In to Dashboard</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
    </button>
  </form>

  <div style="text-align: center; margin-top: 2rem; border-top: 1px solid var(--dash-border); padding-top: 1.25rem;">
    <a href="{% url 'portfolio:home' %}" style="font-size: 0.88rem; color: var(--text-dim); text-decoration: none; display: inline-flex; align-items: center; gap: 0.35rem;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      <span>Back to Portfolio Website</span>
    </a>
  </div>
</div>

</body>
</html>
